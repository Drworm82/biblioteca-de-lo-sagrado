name: Schema tests
# Reader integration validation is part of the PostgreSQL test pipeline.
# Reader seed is intentionally validated against the same migration chain as production data.

on:
  push:
    paths:
      - "db/migrations/**"
      - "tests/database-schema.sql"
      - "tests/adversarial-schema.sql"
      - "tests/reader.sql"
      - "tests/timeline.sql"
      - "tests/canon.sql"
      - "data/seed/reader_demo.sql"
      - "data/seed/historical_corpus.sql"
      - ".github/workflows/schema-tests.yml"
  pull_request:
    paths:
      - "db/migrations/**"
      - "tests/database-schema.sql"
      - "tests/adversarial-schema.sql"
      - ".github/workflows/schema-tests.yml"

jobs:
  postgres-schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: biblioteca_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d biblioteca_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare Supabase-compatible roles
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d biblioteca_test -v ON_ERROR_STOP=1 -c "CREATE ROLE anon NOLOGIN"
          psql -h localhost -U postgres -d biblioteca_test -v ON_ERROR_STOP=1 -c "CREATE ROLE authenticated NOLOGIN"
      - name: Apply migrations
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d biblioteca_test -v ON_ERROR_STOP=1 -f db/migrations/0001_initial_schema.sql
          psql -h localhost -U postgres -d biblioteca_test -v ON_ERROR_STOP=1 -f db/migrations/0002_schema_integrity_patch.sql
          psql -h localhost -U postgres -d biblioteca_test -v ON_ERROR_STOP=1 -f db/migrations/0003_textual_variants_and_versioning.sql
          psql -h localhost -U postgres -d biblioteca_test -v ON_ERROR_STOP=1 -f db/migrations/0004_textual_unit_contents.sql
          psql -h localhost -U postgres -d biblioteca_test -v ON_ERROR_STOP=1 -f db/migrations/0005_historical_events.sql
          psql -h localhost -U postgres -d biblioteca_test -v ON_ERROR_STOP=1 -f db/migrations/0006_public_timeline_read.sql
          psql -h localhost -U postgres -d biblioteca_test -v ON_ERROR_STOP=1 -f db/migrations/0007_public_relation_read.sql
          psql -h localhost -U postgres -d biblioteca_test -v ON_ERROR_STOP=1 -f db/migrations/0008_canon_status.sql
          psql -h localhost -U postgres -d biblioteca_test -v ON_ERROR_STOP=1 -f db/migrations/0009_spanish_editorial_titles.sql
          psql -h localhost -U postgres -d biblioteca_test -v ON_ERROR_STOP=1 -f db/migrations/0010_spanish_corpus_labels.sql
          psql -h localhost -U postgres -d biblioteca_test -v ON_ERROR_STOP=1 -f db/migrations/0011_textual_unit_editions.sql
          psql -h localhost -U postgres -d biblioteca_test -v ON_ERROR_STOP=1 -f db/migrations/0012_move_matthew_critical_text_to_edition.sql
          psql -h localhost -U postgres -d biblioteca_test -v ON_ERROR_STOP=1 -f db/migrations/0013_translation_revisions.sql
      - name: Run schema smoke tests
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d biblioteca_test -v ON_ERROR_STOP=1 -f tests/database-schema.sql
      - name: Run adversarial schema tests
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d biblioteca_test -v ON_ERROR_STOP=1 -f tests/adversarial-schema.sql
      - name: Run historical corpus fixture
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d biblioteca_test -v ON_ERROR_STOP=1 -f data/seed/historical_corpus.sql
      - name: Seed reader demonstration content
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d biblioteca_test -v ON_ERROR_STOP=1 -f data/seed/reader_demo.sql
      - name: Run textual reader validation
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d biblioteca_test -v ON_ERROR_STOP=1 -f tests/reader.sql
      - name: Run timeline validation
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d biblioteca_test -v ON_ERROR_STOP=1 -f tests/timeline.sql
      - name: Run canon status validation
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d biblioteca_test -v ON_ERROR_STOP=1 -f tests/canon.sql
